[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripagent"
version = "0.1.0"
description = "LifeHack 旅游规划智能体：天气风险避让 + 公开数据源编排 + 可校验行程生成"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["streamlit>=1.40"]
dev = ["pytest>=8.2"]

[project.scripts]
tripagent = "tripagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
